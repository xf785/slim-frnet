[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthfp"
version = "2.0.0"
description = "SLIM-FRNet锛氳交閲忕骇 SFinGe 鍚堟垚鎸囩汗鏁版嵁闆嗗悎鎴愬钩鍙帮紙GUI 浼樺厛锛屽彲澶嶇幇锛?
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SLIM-FRNet" }]
keywords = [
    "synthetic-fingerprint",
    "biometrics",
    "dataset-generation",
    "sfinge",
    "reproducibility",
    "gabor",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# --- 鏈€灏忎緷璧栵細浠?4 涓涓夋柟鍖?---
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/xf785/slim-frnet"
Repository = "https://github.com/xf785/slim-frnet"
Issues = "https://github.com/xf785/slim-frnet/issues"
Changelog = "https://github.com/xf785/slim-frnet/releases"
"鏋舵瀯璇存槑" = "https://github.com/xf785/slim-frnet/blob/main/ARCHITECTURE.md"

[project.optional-dependencies]
# GUI 缁戝畾浜岄€変竴鍗冲彲锛氱▼搴忎紭鍏?PySide6锛屽洖閫€ PyQt6
gui = ["PySide6>=6.5"]
gui-pyqt = ["PyQt6>=6.5"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["PySide6>=6.5", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
synthfp = "synthfp.__main__:main"

[project.gui-scripts]
synthfp-gui = "synthfp.gui.app:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["synthfp*"]
# 鏄惧紡鎺掗櫎闈炲寘鐩綍锛氭湰鍦板綊妗ｏ紙_archive/ 閲屽彲鑳芥湁鍑犵櫨 MB 鐨勬棫椤圭洰涓庤櫄鎷熺幆澧冿級銆?# 娴嬭瘯銆佽剼鏈笌鏂囨。銆備笉鍐?exclude 鏃?setuptools 浼氶亶鍘嗘暣妫垫爲锛屾湰鍦版瀯寤轰細闈炲父鎱€?exclude = [
    "_archive*",
    "tests*",
    "tools*",
    "docs*",
    "outputs*",
    "datasets*",
    "build*",
    "dist*",
]

[tool.setuptools.package-data]
synthfp = ["gui/style/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:pydantic.*"]
# 鎺掗櫎涓存椂/宸ュ叿鐩綍锛岄伩鍏嶆敹闆嗛樁娈佃鏃犲叧鐩綍骞叉壈锛坄--setup-show` 涔熶笉浼氳繘鍘伙級銆?# 杩欎簺鍚嶅瓧瑕嗙洊 pytest 鑷繁鐨勪复鏃舵牴銆佹湰椤圭洰鐨勬祴璇曡剼鎵嬫灦鐩綍锛屼互鍙婂彈闄愭矙绠?# 鍙兘鐣欎笅鐨勪笉鍙绌虹洰褰曪紙鏅€氱幆澧冧笅瀹冧滑鏈氨涓嶅瓨鍦紝鍒楀嚭鏃犲壇浣滅敤锛夈€?norecursedirs = [
    "pytest-cache-files-*",
    "pytest-of-*",
    "tmp*",
    "_*probe*",
    "_pytmp",
    "_pytest",
    "_pytest_tmp",
    "_pytestroot",
    "_pytest-work",
    ".pytest*",
    ".venv",
    "venv",
    "__pycache__",
    "_archive",
    "outputs",
    "datasets",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["_archive", ".venv", "outputs", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501 浜ょ粰鏍煎紡鍖栧櫒锛汢008 鏄粯璁ゅ弬鏁拌皟鐢ㄧ殑甯歌璇姤銆?# UP006/UP035/UP045锛坱yping.List 鈫?list 绛夛級鍒绘剰涓嶅惎鐢細鏈寘鎵€鏈夋ā鍧楅兘鏈?# `from __future__ import annotations`锛屾樉寮?typing 娉涘瀷鏄负浜嗚 Python 3.10
# 鐢ㄦ埛鍦ㄤ换鎰忔眰鍊艰矾寰勪笅閮借兘姝ｇ‘瑙ｆ瀽娉ㄨВ锛屽睘浜庢湁鎰忎负涔嬬殑鍙鎬ч€夋嫨銆?ignore = ["E501", "B008", "UP006", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# 鍘熼」鐩凡楠岃瘉鐨勫唴鏍革細淇濈暀鍏跺師濮嬮鏍硷紝鍙仛蹇呰鐨勬渶灏忔敼閫狅紙渚夸簬閫愬儚绱犲鐓э級
"synthfp/legacy/**" = ["E", "F", "W", "I", "B"]
"tests/**" = ["E", "F", "W", "I", "B"]

